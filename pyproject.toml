[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jepanalytics"
version = "0.1.0"
description = "A coordinate-aware JEPA feasibility framework for universal 1-D analytical-signal embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "wandb>=0.28.1",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
data = ["pandas>=2.2", "pyarrow>=15"]
baselines = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5"]
all = [
  "rdkit>=2024.3",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
jepanalytics = "jepanalytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jepanalytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

